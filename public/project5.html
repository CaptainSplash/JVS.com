<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Vin Shields</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'VT323', monospace;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        header {
            background: #000;
            border-bottom: 1px solid #333;
            padding: 1.5rem;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1440px;
            margin: 0 auto;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 2rem;
            font-size: 1.25rem;
            position: relative;
        }

        nav a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 100%;
            height: 2px;
            background-color: #FFCD00;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        nav a:hover::after {
            transform: scaleX(1);
        }
        
        .video-section {
            margin: 2rem auto;
            background: linear-gradient(to bottom, #181818, #111);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 2rem;
        }
        
        video {
            width: 100%;
            border-radius: 8px;
            display: block;
            cursor: pointer;
        }

        .footer-link {
            border-bottom: 2px dotted #fff;
            transition: border-bottom 0.2s, color 0.2s;
        }
        .footer-link:hover, .footer-link:focus {
            border-bottom: 2px solid #fff;
            color: #FFCD00;
        }
        .footer-link sup {
            margin-left: 0.15em; /* Reduced margin to bring closer */
            top: -0.25em; /* Adjusted position for alignment */
        }

        @media (max-width: 1033px) {
            .footer-flex {
                flex-direction: column !important;
                align-items: center !important;
                justify-content: center !important;
                gap: 1.5rem !important;
            }
            
            .footer-left {
                flex: 0 0 100% !important;
                text-align: center !important;
                width: 100% !important;
                margin-bottom: 1rem !important;
            }
            
            .footer-center {
                flex: 0 0 100% !important;
                margin-left: auto !important;
                margin-right: auto !important;
                align-items: center !important;
                width: fit-content !important;
            }
            
            .footer-right {
                flex: 0 0 100% !important;
                text-align: center !important;
                width: 100% !important;
                justify-content: center !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div>
                <a href="/">
                    <img src="/logo.png" alt="JVS Logo" style="height: 40px;">
                </a>
            </div>
            <nav>
                <a href="/">Projects</a>
                <a href="/about">About</a>
                <a href="#">Contact</a>
            </nav>
        </div>
    </header>
    
    <main class="container">
        <div class="video-section">
            <video controls autoplay loop poster="/rebs-milo/Hero image-01.webp" style="cursor: pointer;">
                <source src="/rebs-milo/project-images/Rebs-Milo Compressed 50.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        
        <!-- Previous and Next Project Buttons -->
        <div style="text-align: center; margin-top: 2rem;">
            <a href="/projects/project4" style="margin-right: 1rem; padding: 0.5rem 1rem; background: #333; color: #fff; text-decoration: none; border-radius: 4px; transition: background-color 0.3s, transform 0.2s; display: inline-block;">Previous Project</a>
            <a href="/projects/project1" style="margin-left: 1rem; padding: 0.5rem 1rem; background: #333; color: #fff; text-decoration: none; border-radius: 4px; transition: background-color 0.3s, transform 0.2s; display: inline-block;">Next Project</a>
        </div>
        
        <script>
            // Add hover effects to project navigation buttons
            document.addEventListener('DOMContentLoaded', function() {
                const navButtons = document.querySelectorAll('.container div[style*="text-align: center"] a');
                navButtons.forEach(button => {
                    button.addEventListener('mouseover', function() {
                        this.style.backgroundColor = '#555';
                        this.style.transform = 'translateY(-2px)';
                    });
                    button.addEventListener('mouseout', function() {
                        this.style.backgroundColor = '#333';
                        this.style.transform = 'translateY(0)';
                    });
                });
            });
        </script>
    </main>
</body>
</html>
